{% extends 'base.html' %}

{% block title %}Verify OTP - NotesApp{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-100 mt-10">
    <h2 class="text-3xl font-bold text-center text-gray-900 mb-2">Verify OTP</h2>
    <p class="text-center text-sm text-gray-600 mb-8">A verification code has been sent to your email. Please enter it below.</p>

    <form method="post" action="{% url 'accounts:password_reset_verify' %}" class="space-y-6">
        {% csrf_token %}
        
        <div>
            <label for="otp" class="block text-sm font-medium text-gray-700 mb-1">Enter OTP</label>
            <input type="text" name="otp" id="otp" 
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150" 
                required placeholder="123456" pattern="\d{6}" title="Please enter a 6-digit OTP">
        </div>

        <div>
            <button type="submit" 
                class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition duration-150 shadow-md">
                Verify & Proceed
            </button>
        </div>
    </form>
    
    <div class="mt-8 text-center text-sm text-gray-600">
        Didn't receive the code? <a href="{% url 'accounts:password_reset_request' %}" class="text-indigo-600 font-semibold hover:text-indigo-500">Resend Email</a>
    </div>
</div>
{% endblock %}
