{% extends 'base.html' %}

{% block title %}Reset Password - NotesApp{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-100 mt-10">
    <h2 class="text-3xl font-bold text-center text-gray-900 mb-2">Reset Password</h2>
    <p class="text-center text-sm text-gray-600 mb-8">Enter your registered email address to receive a verification code.</p>

    <form method="post" action="{% url 'accounts:password_reset_request' %}" class="space-y-6">
        {% csrf_token %}
        
        <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
            <input type="email" name="email" id="email" 
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150" 
                required placeholder="your@email.com">
        </div>

        <div>
            <button type="submit" 
                class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition duration-150 shadow-md">
                Send OTP
            </button>
        </div>
    </form>
    
    <div class="mt-8 text-center text-sm text-gray-600">
        Remember your password? <a href="{% url 'accounts:login' %}" class="text-indigo-600 font-semibold hover:text-indigo-500">Back to Login</a>
    </div>
</div>
{% endblock %}
