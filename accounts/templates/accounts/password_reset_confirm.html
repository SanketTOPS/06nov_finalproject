{% extends 'base.html' %}

{% block title %}Set New Password - NotesApp{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-100 mt-10">
    <h2 class="text-3xl font-bold text-center text-gray-900 mb-2">Set New Password</h2>
    <p class="text-center text-sm text-gray-600 mb-8">Please enter your new password below.</p>

    <form method="post" action="{% url 'accounts:password_reset_confirm' %}" class="space-y-6">
        {% csrf_token %}
        
        <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
            <input type="password" name="password" id="password" 
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150" 
                required placeholder="••••••••">
        </div>

        <div>
            <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-1">Confirm New Password</label>
            <input type="password" name="confirm_password" id="confirm_password" 
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150" 
                required placeholder="••••••••">
        </div>

        <div>
            <button type="submit" 
                class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition duration-150 shadow-md">
                Update Password
            </button>
        </div>
    </form>
</div>
{% endblock %}
