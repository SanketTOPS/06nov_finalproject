{% extends 'base.html' %}

{% block title %}Delete "{{ object.title }}" | NotesApp{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-red-100 mt-20 text-center">
    <div class="text-red-500 text-5xl mb-4">⚠️</div>
    <h1 class="text-2xl font-bold text-gray-900 mb-4">Delete this note?</h1>
    <p class="text-gray-500 mb-8">
        Are you sure you want to permanently delete <strong class="text-gray-900">"{{ object.title }}"</strong>? This
        action cannot be undone.
    </p>

    <form method="post" class="flex flex-col space-y-3">
        {% csrf_token %}
        <button type="submit"
            class="bg-red-600 text-white py-3 rounded-xl font-bold hover:bg-red-700 transition duration-150 shadow-md">
            Yes, Delete Permanently
        </button>
        <a href="{% url 'notesapp:detail' object.pk %}"
            class="bg-gray-100 text-gray-700 py-3 rounded-xl font-bold hover:bg-gray-200 transition duration-150">
            No, Keep it
        </a>
    </form>
</div>
{% endblock %}
