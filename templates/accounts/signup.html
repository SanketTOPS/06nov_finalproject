{% extends 'base.html' %}

{% block title %}Sign Up | NotesApp{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-100 mt-10">
    <h2 class="text-3xl font-bold text-center text-gray-900 mb-8">Create your account</h2>
    <form method="post" class="space-y-6">
        {% csrf_token %}
        <div class="space-y-4">
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
                    <div class="mt-1">
                        {{ field }}
                    </div>
                    {% if field.errors %}
                        <div class="text-red-500 text-sm mt-1">
                            {{ field.errors.0 }}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}
        </div>
            <button type="submit"
                class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition duration-150 shadow-md">
                Sign Up
            </button>
        </div>
    </form>
    <div class="mt-8 text-center text-sm text-gray-600">
        Already have an account? <a href="{% url 'accounts:login' %}"
            class="text-indigo-600 font-semibold hover:text-indigo-500">Login</a>
    </div>
</div>
{% endblock %}
